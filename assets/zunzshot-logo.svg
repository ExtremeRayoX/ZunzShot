<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Fondo oscuro tipo squircle exacto (sin contorno blanco) -->
    <linearGradient id="bgGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2c3035" />
      <stop offset="50%" stop-color="#212328" />
      <stop offset="100%" stop-color="#17181c" />
    </linearGradient>

    <!-- Máscara squircle continua (estilo macOS) -->
    <clipPath id="squircleClip">
      <path d="M 272,42 L 752,42 C 872,42 982,152 982,272 L 982,752 C 982,872 872,982 752,982 L 272,982 C 152,982 42,872 42,752 L 42,272 C 42,152 152,42 272,42 Z" />
    </clipPath>

    <!-- Filtros de resplandor suave para colibrí y flor-captura -->
    <filter id="birdOuterGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="flowerGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" />
    </filter>

    <!-- Halo ambiental detrás del colibrí -->
    <radialGradient id="birdAmbientGlow" cx="0.34" cy="0.36" r="0.36">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#06d6c6" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#06d6c6" stop-opacity="0" />
    </radialGradient>

    <!-- Resplandor y relleno del recuadro-flor -->
    <radialGradient id="flowerAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#eafffc" stop-opacity="0.90" />
      <stop offset="38%" stop-color="#88f7ea" stop-opacity="0.48" />
      <stop offset="72%" stop-color="#2dd4bf" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="flowerBoxFill" cx="0.52" cy="0.48" r="0.58">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#dcfff9" />
      <stop offset="100%" stop-color="#b4f5ec" />
    </radialGradient>

    <linearGradient id="bracketTopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4f9fc" />
      <stop offset="100%" stop-color="#bcf2ea" />
    </linearGradient>

    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c6fce5" />
      <stop offset="55%" stop-color="#a5f3e9" />
      <stop offset="100%" stop-color="#8decf7" />
    </linearGradient>

    <linearGradient id="leafLeftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6f8ff" />
      <stop offset="100%" stop-color="#9cf2f7" />
    </linearGradient>

    <linearGradient id="leafRightGrad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbf8ff" />
      <stop offset="100%" stop-color="#9ff1f4" />
    </linearGradient>

    <linearGradient id="leafPhotoInnerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#265460" />
      <stop offset="100%" stop-color="#1c3f49" />
    </linearGradient>

    <!-- Degradados por faceta del colibrí origami -->
    <linearGradient id="grad_rw_main" x1="0.592" y1="0.065" x2="0.450" y2="0.959">
      <stop offset="0%" stop-color="#19ffff" />
      <stop offset="100%" stop-color="#2f69b6" />
    </linearGradient>
    <linearGradient id="grad_rw_shadow" x1="0.620" y1="0.097" x2="0.262" y2="0.795">
      <stop offset="0%" stop-color="#16b795" />
      <stop offset="100%" stop-color="#0a536d" />
    </linearGradient>
    <linearGradient id="grad_fw_top" x1="0.813" y1="0.149" x2="0.219" y2="0.778">
      <stop offset="0%" stop-color="#45faf9" />
      <stop offset="100%" stop-color="#14fffd" />
    </linearGradient>
    <linearGradient id="grad_fw_mid" x1="1.013" y1="0.529" x2="0.001" y2="0.443">
      <stop offset="0%" stop-color="#1db0d4" />
      <stop offset="100%" stop-color="#15f1f0" />
    </linearGradient>
    <linearGradient id="grad_fw_low" x1="1.085" y1="0.575" x2="-0.047" y2="0.232">
      <stop offset="0%" stop-color="#1e5da6" />
      <stop offset="100%" stop-color="#1bdbe6" />
    </linearGradient>
    <linearGradient id="grad_fw_green" x1="0.582" y1="0.793" x2="-0.105" y2="0.052">
      <stop offset="0%" stop-color="#0a8086" />
      <stop offset="100%" stop-color="#10ff9a" />
    </linearGradient>
    <linearGradient id="grad_b_nape" x1="0.861" y1="0.929" x2="0.314" y2="0.267">
      <stop offset="0%" stop-color="#06ffb0" />
      <stop offset="100%" stop-color="#20afa1" />
    </linearGradient>
    <linearGradient id="grad_b_sh_chest" x1="0.826" y1="0.300" x2="0.267" y2="0.500">
      <stop offset="0%" stop-color="#04b6a6" />
      <stop offset="100%" stop-color="#13d891" />
    </linearGradient>
    <linearGradient id="grad_b_upper_back" x1="0.55" y1="0.95" x2="0.35" y2="0.05">
      <stop offset="0%" stop-color="#7bffab" />
      <stop offset="65%" stop-color="#2ce09c" />
      <stop offset="100%" stop-color="#119e8b" />
    </linearGradient>
    <linearGradient id="grad_b_upper_chest" x1="0.988" y1="0.837" x2="0.200" y2="0.474">
      <stop offset="0%" stop-color="#00c886" />
      <stop offset="100%" stop-color="#2fd897" />
    </linearGradient>
    <linearGradient id="grad_b_neck_cyan" x1="0.794" y1="-0.101" x2="0.064" y2="0.893">
      <stop offset="0%" stop-color="#1c91b1" />
      <stop offset="100%" stop-color="#08e2f3" />
    </linearGradient>
    <linearGradient id="grad_b_neck_right" x1="0.752" y1="0.553" x2="0.443" y2="0.466">
      <stop offset="0%" stop-color="#3c4ebd" />
      <stop offset="100%" stop-color="#0bc1cf" />
    </linearGradient>
    <linearGradient id="grad_b_chest_edge" x1="0.2" y1="0.5" x2="0.85" y2="0.5">
      <stop offset="0%" stop-color="#1c86cf" />
      <stop offset="100%" stop-color="#2a9ce0" />
    </linearGradient>
    <linearGradient id="grad_b_belly_blue" x1="0.48" y1="0.05" x2="0.58" y2="0.85">
      <stop offset="0%" stop-color="#097d7f" />
      <stop offset="55%" stop-color="#1c61a5" />
      <stop offset="100%" stop-color="#2554ad" />
    </linearGradient>
    <linearGradient id="grad_t_strip_top" x1="0.987" y1="0.755" x2="0.258" y2="0.480">
      <stop offset="0%" stop-color="#0de286" />
      <stop offset="100%" stop-color="#2dcdba" />
    </linearGradient>
    <linearGradient id="grad_t_strip_low" x1="0.12" y1="0.35" x2="0.72" y2="0.32">
      <stop offset="0%" stop-color="#22e8bc" />
      <stop offset="48%" stop-color="#0da795" />
      <stop offset="100%" stop-color="#223688" />
    </linearGradient>
    <linearGradient id="grad_t_mid_indigo" x1="0.58" y1="0.05" x2="0.28" y2="0.92">
      <stop offset="0%" stop-color="#231c6e" />
      <stop offset="55%" stop-color="#35399c" />
      <stop offset="100%" stop-color="#4152b4" />
    </linearGradient>
    <linearGradient id="grad_t_tip_blue" x1="0.15" y1="0.45" x2="0.80" y2="0.80">
      <stop offset="0%" stop-color="#4263bf" />
      <stop offset="100%" stop-color="#2850a6" />
    </linearGradient>
    <linearGradient id="grad_t_back_violet" x1="0.85" y1="0.38" x2="0.05" y2="0.68">
      <stop offset="0%" stop-color="#2e3b98" />
      <stop offset="65%" stop-color="#1d2273" />
      <stop offset="100%" stop-color="#172c7a" />
    </linearGradient>
    <linearGradient id="grad_h_crown_top" x1="0.0" y1="0.0" x2="0.85" y2="1.0">
      <stop offset="0%" stop-color="#88f7c3" />
      <stop offset="55%" stop-color="#6af9a8" />
      <stop offset="100%" stop-color="#4ee69d" />
    </linearGradient>
    <linearGradient id="grad_h_forehead" x1="0.15" y1="0.00" x2="0.88" y2="1.00">
      <stop offset="0%" stop-color="#1df291" />
      <stop offset="100%" stop-color="#0ac484" />
    </linearGradient>
    <linearGradient id="grad_h_cheek_dark" x1="1.001" y1="0.526" x2="0.176" y2="0.391">
      <stop offset="0%" stop-color="#49308c" />
      <stop offset="100%" stop-color="#2b509e" />
    </linearGradient>
    <linearGradient id="grad_h_beak_up" x1="0.449" y1="0.224" x2="0.356" y2="0.502">
      <stop offset="0%" stop-color="#72a9c6" />
      <stop offset="100%" stop-color="#445d9b" />
    </linearGradient>
    <linearGradient id="grad_h_beak_low" x1="0.387" y1="0.326" x2="0.358" y2="0.470">
      <stop offset="0%" stop-color="#172767" />
      <stop offset="100%" stop-color="#3c4290" />
    </linearGradient>
  </defs>

  <g id="ZunzShot-Icon" clip-path="url(#squircleClip)">
    <!-- 1. Fondo Oscuro -->
    <g id="background">
      <path d="M 272,42 L 752,42 C 872,42 982,152 982,272 L 982,752 C 982,872 872,982 752,982 L 272,982 C 152,982 42,872 42,752 L 42,272 C 42,152 152,42 272,42 Z" fill="url(#bgGrad)" />
      <circle cx="350" cy="360" r="350" fill="url(#birdAmbientGlow)" />
    </g>

    <!-- 2. Flor de Captura + Tallo + Hojas de Fotos -->
    <g id="capture-flower">
      <!-- Aura de luz exterior de la flor -->
      <circle cx="737" cy="569" r="195" fill="url(#flowerAura)" />
      <rect x="640" y="472" width="194" height="194" rx="8" fill="#9cfff0" opacity="0.58" filter="url(#flowerGlowFilter)" />

      <!-- Tallo y hojas tipo archivo de foto -->
      <g id="flower-stem-and-leaves">
        <rect id="stem" x="729" y="662" width="15" height="322" fill="url(#stemGrad)" />

        <!-- Hoja izquierda (tarjeta de foto en perspectiva pegada al tallo) -->
        <g id="leaf-photo-left">
          <polygon points="634,755 712,791 712,875 602,824" fill="url(#leafLeftGrad)" />
          <polygon points="640,773 698,800 677,845 617,816" fill="url(#leafPhotoInnerGrad)" />
        </g>

        <!-- Hoja derecha (tarjeta de foto en perspectiva pegada al tallo) -->
        <g id="leaf-photo-right">
          <polygon points="839,732 871,801 761,853 761,768" fill="url(#leafRightGrad)" />
          <polygon points="831,750 854,796 796,823 774,777" fill="url(#leafPhotoInnerGrad)" />
        </g>
      </g>

      <!-- Cabeza de la flor (Recuadro escalonado luminoso + 4 esquinas de captura) -->
      <g id="flower-blossom-capture-frame">
        <!-- Recuadro central luminoso con muescas en las 4 esquinas -->
        <path id="flower-inner-frame" d="M 685,472 L 789,472 L 789,490 L 817,490 L 817,517 L 834,517 L 834,621 L 817,621 L 817,648 L 789,648 L 789,666 L 685,666 L 685,648 L 657,648 L 657,621 L 640,621 L 640,517 L 657,517 L 657,490 L 685,490 Z" fill="url(#flowerBoxFill)" />

        <!-- 4 Esquinas exteriores de recorte (crop brackets) -->
        <g id="crop-brackets" fill="url(#bracketTopGrad)">
          <!-- Esquina superior izquierda -->
          <path d="M 625,517 L 625,469 Q 625,457 637,457 L 685,457 L 685,472 L 643,472 Q 640,472 640,475 L 640,517 Z" />
          <!-- Esquina superior derecha -->
          <path d="M 789,457 L 837,457 Q 849,457 849,469 L 849,517 L 834,517 L 834,475 Q 834,472 831,472 L 789,472 Z" />
          <!-- Esquina inferior derecha -->
          <path d="M 849,621 L 849,669 Q 849,681 837,681 L 789,681 L 789,666 L 831,666 Q 834,666 834,663 L 834,621 Z" />
          <!-- Esquina inferior izquierda -->
          <path d="M 685,681 L 637,681 Q 625,681 625,669 L 625,621 L 640,621 L 640,663 Q 640,666 643,666 L 685,666 Z" />
        </g>
      </g>
    </g>

    <!-- 3. Colibrí Origami Poligonal -->
    <g id="hummingbird">
      <!-- Halo cian suave exterior detrás de la silueta del colibrí -->
      <path id="bird-halo" d="M 134,174 L 292,235 L 268,131 L 384,223 L 441,329 L 505,266 L 564,276 L 601,321 L 717,395 L 581,340 L 530,372 L 485,468 L 349,526 L 377,591 L 315,658 L 282,595 L 316,469 L 342,409 L 191,286 Z" fill="#08d9e6" opacity="0.28" filter="url(#birdOuterGlow)" />

      <g id="wings-rear">
        <polygon id="rw_main" points="268,131 384,223 363,270 292,235" fill="url(#grad_rw_main)" stroke="url(#grad_rw_main)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="rw_shadow" points="384,223 441,329 363,270" fill="url(#grad_rw_shadow)" stroke="url(#grad_rw_shadow)" stroke-width="0.6" stroke-linejoin="round" />
      </g>
      <g id="wings-front">
        <polygon id="fw_top" points="134,174 323,247 191,286" fill="url(#grad_fw_top)" stroke="url(#grad_fw_top)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="fw_mid" points="191,286 323,247 332,326" fill="url(#grad_fw_mid)" stroke="url(#grad_fw_mid)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="fw_low" points="191,286 332,326 342,409" fill="url(#grad_fw_low)" stroke="url(#grad_fw_low)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="fw_green" points="323,247 441,329 342,409 332,326" fill="url(#grad_fw_green)" stroke="url(#grad_fw_green)" stroke-width="0.6" stroke-linejoin="round" />
      </g>
      <g id="body-and-tail">
        <polygon id="b_nape" points="441,329 505,266 547,304" fill="url(#grad_b_nape)" stroke="url(#grad_b_nape)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="b_sh_chest" points="410,355 441,329 471,434" fill="url(#grad_b_sh_chest)" stroke="url(#grad_b_sh_chest)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="b_upper_back" points="342,409 410,355 363,453" fill="url(#grad_b_upper_back)" stroke="url(#grad_b_upper_back)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="b_upper_chest" points="410,355 471,434 363,453" fill="url(#grad_b_upper_chest)" stroke="url(#grad_b_upper_chest)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="b_neck_cyan" points="441,329 547,304 471,434" fill="url(#grad_b_neck_cyan)" stroke="url(#grad_b_neck_cyan)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="b_neck_right" points="547,304 530,372 471,434" fill="url(#grad_b_neck_right)" stroke="url(#grad_b_neck_right)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="b_chest_edge" points="530,372 485,468 471,434" fill="url(#grad_b_chest_edge)" stroke="url(#grad_b_chest_edge)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="b_belly_blue" points="363,453 471,434 485,468 349,526" fill="url(#grad_b_belly_blue)" stroke="url(#grad_b_belly_blue)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="t_strip_top" points="342,409 363,453 316,469" fill="url(#grad_t_strip_top)" stroke="url(#grad_t_strip_top)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="t_strip_low" points="316,469 363,453 282,595" fill="url(#grad_t_strip_low)" stroke="url(#grad_t_strip_low)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="t_mid_indigo" points="363,453 349,526 282,595" fill="url(#grad_t_mid_indigo)" stroke="url(#grad_t_mid_indigo)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="t_tip_blue" points="282,595 349,526 315,658" fill="url(#grad_t_tip_blue)" stroke="url(#grad_t_tip_blue)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="t_back_violet" points="349,526 377,591 315,658" fill="url(#grad_t_back_violet)" stroke="url(#grad_t_back_violet)" stroke-width="0.6" stroke-linejoin="round" />
      </g>
      <g id="head-and-beak">
        <polygon id="h_crown_top" points="505,266 564,276 547,304" fill="url(#grad_h_crown_top)" stroke="url(#grad_h_crown_top)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="h_forehead" points="564,276 601,321 565,321 547,304" fill="url(#grad_h_forehead)" stroke="url(#grad_h_forehead)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="h_cheek_dark" points="547,304 565,321 581,340 530,372" fill="url(#grad_h_cheek_dark)" stroke="url(#grad_h_cheek_dark)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="h_beak_up" points="565,321 601,321 717,395" fill="url(#grad_h_beak_up)" stroke="url(#grad_h_beak_up)" stroke-width="0.6" stroke-linejoin="round" />
        <polygon id="h_beak_low" points="565,321 717,395 581,340" fill="url(#grad_h_beak_low)" stroke="url(#grad_h_beak_low)" stroke-width="0.6" stroke-linejoin="round" />
      </g>
    </g>
  </g>
</svg>
