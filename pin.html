<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZunzShot Pin</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .pin-shell {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 8px;
        overflow: hidden;
        box-sizing: border-box;
        border: 1.5px solid rgba(6, 214, 198, 0.55);
        background: rgba(15, 23, 42, 0.12);
        cursor: grab;
      }

      .pin-shell:active {
        cursor: grabbing;
      }

      .pin-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
      }

      .pin-hud {
        position: fixed;
        top: 6px;
        right: 6px;
        max-width: calc(100% - 12px);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 4px;
        padding: 3px 5px;
        border-radius: 999px;
        background: rgba(11, 16, 27, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transition: opacity 0.14s ease;
      }

      .pin-shell:hover .pin-hud {
        opacity: 1;
      }

      .pin-btn {
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: #f8fafc;
        font-size: 11px;
        font-weight: 600;
        height: 22px;
        min-width: 22px;
        padding: 0 7px;
        border-radius: 999px;
        cursor: pointer;
      }

      .pin-btn:hover {
        background: rgba(6, 214, 198, 0.25);
        color: #67f3e8;
      }

      .pin-btn.close:hover {
        background: rgba(239, 68, 68, 0.85);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div id="pin-shell" class="pin-shell" data-tauri-drag-region>
      <img id="pin-img" class="pin-img" alt="Pinned capture" />
      <div class="pin-hud">
        <button id="btn-opacity" class="pin-btn" title="Opacidad">100%</button>
        <button id="btn-copy" class="pin-btn" title="Copiar">Copiar</button>
        <button id="btn-close" class="pin-btn close" title="Cerrar (Esc)">×</button>
      </div>
    </div>
    <script type="module" src="/src/main-pin.ts"></script>
  </body>
</html>
