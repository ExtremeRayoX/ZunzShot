<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZunzShot</title>
    <style>
      :root {
        --dur: 4000ms;
        --svg-w: min(820px, 95vw, calc(76vh * 1944 / 1080));
        --accent-1: #2dd4bf;
        --accent-2: #818cf8;
        --badge-border: rgba(45, 212, 191, 0.4);
        --spring-bloom: cubic-bezier(0.22, 1.28, 0.36, 1);
        --ease-flight: cubic-bezier(0.22, 1, 0.36, 1);
      }
      @supports (animation-timing-function: linear(0, 1)) {
        :root {
          --spring-bloom: linear(
            0, 0.012 1%, 0.05 2.2%, 0.42 7%, 0.89 13%, 1.07 17%,
            1.11 20%, 1.08 24%, 1.01 31%, 0.99 39%, 1
          );
        }
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      }

      .splash-lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        translate: 0px 0px;
        rotate: 0deg;
        scale: 1;
      }

      .splash-svg {
        width: var(--svg-w);
        height: auto;
        aspect-ratio: 1944 / 1080;
        display: block;
        overflow: visible;
      }

      .svg-part {
        transform-box: view-box;
      }
      #background-layer { transform-origin: 512px 512px; }
      #flower-stem-and-leaves { transform-origin: 737px 982px; }
      #leaf-photo-left { transform-origin: 718px 825px; }
      #leaf-photo-right { transform-origin: 755px 802px; }
      #flower-blossom-capture-frame { transform-origin: 737px 569px; }
      #crop-brackets { transform-origin: 737px 569px; }
      #impact-ring {
        transform-origin: 737px 569px;
        opacity: 0;
      }
      #hummingbird { transform-origin: 450px 380px; }
      #wings-front { transform-origin: 412px 322px; }
      #wings-rear { transform-origin: 405px 305px; }

      .wordmark {
        margin-top: calc(var(--svg-w) * -0.034);
        font-size: calc(var(--svg-w) * 0.088);
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1;
        white-space: nowrap;
        color: #f8fafc;
        text-shadow: 0 4px 18px rgba(2, 6, 23, 0.65);
        translate: 0px 0px;
        scale: 1;
      }
      .wordmark-accent {
        background: linear-gradient(135deg, var(--accent-1) 0%, #38bdf8 55%, var(--accent-2) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .festive-badge {
        display: none;
        margin-top: 10px;
        padding: 5px 14px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid var(--badge-border);
        color: #e2e8f0;
        font-size: calc(var(--svg-w) * 0.017);
        font-weight: 600;
        letter-spacing: 0.01em;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      }
      .festive-badge.is-visible {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .festive-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-1);
        flex-shrink: 0;
      }

      /* Accesorios y partículas festivas: ocultos salvo activación por tema */
      .festive-accessory,
      .particle-group {
        display: none;
      }
      .festive-accessory.is-active,
      .particle-group.is-active {
        display: inline;
      }
      .particle-group {
        transform-box: view-box;
        transform-origin: 512px 512px;
      }

      /* Visibilidad estática por defecto */
      #flower-glow-rect { opacity: 0.58; }
      #bird-halo { opacity: 0.28; }

      @media (prefers-reduced-motion: no-preference) {
        .splash-lockup {
          animation: lockupFadeOut var(--dur) linear 1 both;
        }
        #background-layer {
          animation: cardFormOnTouch var(--dur) var(--spring-bloom) 1 both;
        }
        #flower-stem-and-leaves {
          animation: stemGrow var(--dur) var(--ease-flight) 1 both;
        }
        #leaf-photo-left {
          animation: leafLeftOpen var(--dur) var(--spring-bloom) 1 both;
        }
        #leaf-photo-right {
          animation: leafRightOpen var(--dur) var(--spring-bloom) 1 both;
        }
        #flower-blossom-capture-frame {
          animation: flowerBloomAndPulse var(--dur) var(--ease-flight) 1 both;
        }
        #crop-brackets {
          animation: bracketsSnap var(--dur) var(--spring-bloom) 1 both;
        }
        #impact-ring {
          animation: impactPulse var(--dur) ease-out 1 both;
        }
        #flower-glow-rect {
          animation: flowerGlowOnTouch var(--dur) ease-out 1 both;
        }
        #bird-halo {
          animation: birdHaloOnTouch var(--dur) ease-out 1 both;
        }
        #hummingbird {
          animation: birdFlightOutside var(--dur) var(--ease-flight) 1 both;
        }
        #wings-front {
          animation: wingFrontBeat var(--dur) ease-in-out 1 both;
        }
        #wings-rear {
          animation: wingRearBeat var(--dur) ease-in-out 1 both;
        }
        .particle-group.is-active {
          animation: particlesBurst var(--dur) ease-out 1 both;
        }
        .wordmark,
        .festive-badge.is-visible {
          animation: wordmarkReveal var(--dur) var(--ease-flight) 1 both;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-lockup {
          animation: reducedFade var(--dur) ease 1 both;
        }
      }

      @keyframes reducedFade {
        0% { opacity: 0; }
        9%, 89% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* Inicio con ~2% (80ms) de margen para absorber latencia de primer frame sin recortar */
      @keyframes lockupFadeOut {
        0%, 89% { opacity: 1; transform: scale(1); }
        100%    { opacity: 0; transform: scale(0.96); }
      }

      @keyframes cardFormOnTouch {
        0%, 34%   { opacity: 0; transform: scale(0.91); }
        42%, 100% { opacity: 1; transform: scale(1); }
      }

      @keyframes stemGrow {
        0%, 2%    { opacity: 0; transform: scaleY(0.15); }
        11%, 100% { opacity: 1; transform: scaleY(1); }
      }

      @keyframes leafLeftOpen {
        0%, 5%    { opacity: 0; transform: scale(0.4) rotate(22deg); }
        16%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }

      @keyframes leafRightOpen {
        0%, 7%    { opacity: 0; transform: scale(0.4) rotate(-22deg); }
        17%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }

      @keyframes flowerBloomAndPulse {
        0%, 2%    { opacity: 0; transform: scale(0.5); }
        13%       { opacity: 1; transform: scale(1.05); }
        17%, 34%  { opacity: 1; transform: scale(1); }
        37%       { opacity: 1; transform: scale(1.1) rotate(2deg); }
        43%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }

      @keyframes bracketsSnap {
        0%, 4%    { opacity: 0; transform: scale(1.24); }
        14%, 34%  { opacity: 1; transform: scale(1); }
        37%       { opacity: 1; transform: scale(0.92); }
        43%, 100% { opacity: 1; transform: scale(1); }
      }

      @keyframes impactPulse {
        0%, 35% { opacity: 0; transform: scale(0.65); }
        37%     { opacity: 0.82; transform: scale(1.05); }
        47%     { opacity: 0; transform: scale(1.65); }
        100%    { opacity: 0; transform: scale(1.65); }
      }

      @keyframes flowerGlowOnTouch {
        0%, 35%   { opacity: 0; }
        44%, 100% { opacity: 0.58; }
      }

      @keyframes birdHaloOnTouch {
        0%, 38%   { opacity: 0; }
        47%, 100% { opacity: 0.28; }
      }

      @keyframes particlesBurst {
        0%, 35%   { opacity: 0; transform: scale(0.75) translateY(16px); }
        44%       { opacity: 1; transform: scale(1) translateY(0px); }
        89%, 100% { opacity: 0.85; transform: scale(1.06) translateY(-14px); }
      }

      @keyframes birdFlightOutside {
        0%, 8% {
          opacity: 0;
          transform: translate(-580px, -110px) rotate(-17deg) scale(0.74);
          animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        19% {
          opacity: 1;
          transform: translate(-260px, -44px) rotate(-7deg) scale(0.92);
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
        }
        32% {
          opacity: 1;
          transform: translate(-10px, -12px) rotate(-4deg) scale(1);
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }
        35% {
          opacity: 1;
          transform: translate(14px, 54px) rotate(6deg) scale(1);
          animation-timing-function: cubic-bezier(0.34, 1.35, 0.64, 1);
        }
        42%, 100% {
          opacity: 1;
          transform: translate(0px, 0px) rotate(0deg) scale(1);
        }
      }

      @keyframes wingFrontBeat {
        0%, 10%   { transform: rotate(0deg) scaleY(1); }
        13%       { transform: rotate(-16deg) scaleY(0.72); }
        15%       { transform: rotate(8deg) scaleY(1.04); }
        17%       { transform: rotate(-16deg) scaleY(0.74); }
        20%       { transform: rotate(8deg) scaleY(1.03); }
        22%       { transform: rotate(-15deg) scaleY(0.76); }
        24%       { transform: rotate(7deg) scaleY(1.03); }
        26%       { transform: rotate(-14deg) scaleY(0.78); }
        29%       { transform: rotate(6deg) scaleY(1.02); }
        31%       { transform: rotate(-12deg) scaleY(0.8); }
        33%       { transform: rotate(5deg) scaleY(1.02); }
        36%       { transform: rotate(-10deg) scaleY(0.84); }
        39%       { transform: rotate(4deg) scaleY(1.01); }
        42%, 100% { transform: rotate(0deg) scaleY(1); }
      }

      @keyframes wingRearBeat {
        0%, 10%   { transform: rotate(0deg) scaleY(1); }
        13%       { transform: rotate(12deg) scaleY(0.82); }
        15%       { transform: rotate(-10deg) scaleY(1.04); }
        17%       { transform: rotate(12deg) scaleY(0.82); }
        20%       { transform: rotate(-10deg) scaleY(1.03); }
        22%       { transform: rotate(11deg) scaleY(0.84); }
        24%       { transform: rotate(-9deg) scaleY(1.03); }
        26%       { transform: rotate(10deg) scaleY(0.85); }
        29%       { transform: rotate(-8deg) scaleY(1.02); }
        31%       { transform: rotate(9deg) scaleY(0.88); }
        33%       { transform: rotate(-6deg) scaleY(1.01); }
        36%       { transform: rotate(7deg) scaleY(0.9); }
        39%       { transform: rotate(-4deg) scaleY(1); }
        42%, 100% { transform: rotate(0deg) scaleY(1); }
      }

      @keyframes wordmarkReveal {
        0%, 38%   { opacity: 0; transform: translateY(10px) scale(0.96); }
        47%, 100% { opacity: 1; transform: translateY(0px) scale(1); }
      }
    </style>
  </head>
  <body>
    <div class="splash-lockup">
      <svg
        class="splash-svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="-460 -20 1944 1080"
        aria-label="ZunzShot Logo"

            <stop offset="100%" stop-color="#0a536d" />
          </linearGradient>

            <stop offset="0%" stop-color="#45faf9" />
            <stop offset="100%" stop-color="#14fffd" />
          </linearGradient>

          </linearGradient>

          </linearGradient>

          </linearGradient>
          <linearGradient id="grad_b_belly_blue" x1="0.48" y1="0.05" x2="0.58" y2="0.85">
            <stop offset="0%" stop-color="#097d7f" />

        </defs>

        <!-- Base del ícono recortada en squircle -->
        <g id="ZunzShot-Card" clip-path="url(#squircleClip)">
          <g id="background-layer" class="svg-part">
            <path d="M 272,42 L 752,42 C 872,42 982,152 982,272 L 982,752 C 982,872 872,982 752,982 L 272,982 C 152,982 42,872 42,752 L 42,272 C 42,152 152,42 272,42 Z" fill="url(#bgGrad)" />
            <circle cx="350" cy="360" r="350" fill="url(#birdAmbientGlow)" />
            <path id="card-accent-stroke" d="M 272,45 L 752,45 C 870,45 979,154 979,272 L 979,752 C 979,870 870,979 752,979 L 272,979 C 154,979 45,870 45,752 L 45,272 C 45,154 154,45 272,45 Z" fill="none" stroke="none" stroke-width="8" />
          </g>

          <!-- Halo estático del colibrí: sin blur durante el vuelo -->
          <path id="bird-halo" d="M 134,174 L 292,235 L 268,131 L 384,223 L 441,329 L 505,266 L 564,276 L 601,321 L 717,395 L 581,340 L 530,372 L 485,468 L 349,526 L 377,591 L 315,658 L 282,595 L 316,469 L 342,409 L 191,286 Z" fill="#08d9e6" opacity="0.28" filter="url(#birdOuterGlow)" />

          <!-- Partículas festivas (opcionales según calendario remoto) -->
          <g id="particles-snow" class="particle-group" fill="#f8fafc">
            <circle cx="160" cy="180" r="10" opacity="0.85" />
            <circle cx="840" cy="170" r="12" opacity="0.75" />

    <script>
      (function applyThemeFromQuery() {
        const params = new URLSearchParams(window.location.search);
        const setStop = (id, color) => {
          const el = color ? document.getElementById(id) : null;
          if (el) el.setAttribute("stop-color", color);
        };

        const a1 = params.get("a1");
        const a2 = params.get("a2");
        if (a1) {
          document.documentElement.style.setProperty("--accent-1", a1);
          const ring = document.getElementById("impact-ring");
          if (ring) ring.setAttribute("stroke", a1);
        }
        if (a2) {
          document.documentElement.style.setProperty("--accent-2", a2);
        }

        const cb = params.get("cb");
        if (cb) {
          document.documentElement.style.setProperty("--badge-border", cb);
          const strokePath = document.getElementById("card-accent-stroke");
          if (strokePath) strokePath.setAttribute("stroke", cb);
        }

        const f1 = params.get("f1");
        const f2 = params.get("f2");
        if (f1) {
          setStop("flowerFillStart", f1);
          setStop("flowerFillMid", f1);
        }
        if (f2) {
          setStop("flowerFillEnd", f2);
          setStop("bracketStop1", f2);
          setStop("bracketStop2", f2);
        }

        const fa = params.get("fa");
        if (fa) {
          setStop("auraStop2", fa);
          setStop("auraStop3", fa);
          setStop("auraStop4", fa);
          const glowRect = document.getElementById("flower-glow-rect");
          if (glowRect) glowRect.setAttribute("fill", fa);
        }

        const bg = params.get("bg");
        if (bg) {
          setStop("bgGlowStop1", bg);
          setStop("bgGlowStop2", bg);
          setStop("bgGlowStop3", bg);
          const halo = document.getElementById("bird-halo");
          if (halo) halo.setAttribute("fill", bg);
        }

        const acc = params.get("acc");
        if (acc) {
          const accEl = document.getElementById(`accessory-${acc}`);
          if (accEl) accEl.classList.add("is-active");
        }

        const pt = params.get("pt");
        if (pt) {
          const ptEl = document.getElementById(`particles-${pt}`);
          if (ptEl) ptEl.classList.add("is-active");
        }

        const badge = params.get("badge");
        if (badge) {
          const badgeEl = document.getElementById("festiveBadge");
          const badgeText = document.getElementById("festiveBadgeText");
          if (badgeEl && badgeText) {
            badgeText.textContent = badge;
            badgeEl.classList.add("is-visible");
          }
        }
      })();
    </script>
