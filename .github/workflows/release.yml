name: Build ZunzShot (macOS & Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-15-intel
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: v__VERSION__
          releaseName: "ZunzShot v__VERSION__"
          releaseBody: |
            Instaladores oficiales de ZunzShot v__VERSION__:
            - **macOS (Universal):** `ZunzShot___VERSION___universal.dmg` (Apple Silicon e Intel)
            - **Windows (Instalador oficial):** `ZunzShot___VERSION___x64-setup.exe`

            ### Novedades incluidas
            - **Actualizaciones en ventana independiente:** *Buscar actualizaciones* ahora abre su propia ventana desde la bandeja del sistema o ante un aviso automático, sin levantar el menú principal detrás, y cuenta con su sección propia en Configuración justo encima de *Acerca de*.
            - **Comprobación cada 30 minutos y recordatorios flexibles:** Al activar actualizaciones automáticas, ZunzShot revisa cada **30 minutos** y te permite elegir recordar más tarde en **2**, **4** o **6 horas**.
            - **Detalles de versión más legibles:** Las notas de actualización se muestran organizadas con títulos, listas y resaltados limpios.
            - **Control centralizado:** Las actualizaciones automáticas ahora se configuran únicamente desde la pantalla de actualizaciones, simplificando *General* y *Acerca de*.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "v${VERSION}" --draft=false
