name: Build ZunzShot (macOS & Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-15-intel
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: v__VERSION__
          releaseName: "ZunzShot v__VERSION__"
          releaseBody: |
            Instaladores oficiales de ZunzShot v__VERSION__:
            - **macOS (Universal):** `ZunzShot___VERSION___universal.dmg` (Apple Silicon e Intel)
            - **Windows (Instalador ligero — recomendado):** `ZunzShot___VERSION___x64-setup.exe`
            - **Windows (Instalador offline completo):** `ZunzShot___VERSION___x64-offline-setup.exe`

            ### Mejoras y correcciones incluidas
            - Control de instancia única en segundo plano y corrección de clic en el ícono de bandeja en Windows.
            - Detección de conflictos de atajos con el sistema operativo, guardado seguro de combinaciones y foco reforzado en el lienzo.
            - Posicionamiento y tamaño exacto en configuraciones multi-monitor con DPI mixto para avisos de copiado y capturas fijadas (Pin).
            - Manejo mejorado de nivel de ventana y limpieza de archivos temporales al compartir, imprimir y guardar.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build Windows offline installers
        if: success() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "src-tauri/target/release/bundle"
          npm run tauri -- build -c src-tauri/tauri.offline.conf.json

      - name: Rename and upload Windows offline installers
        if: success() && matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $outDir = "dist-offline"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $exe -or -not $msi) {
            throw "Expected offline NSIS (.exe) and MSI (.msi) installers were not generated."
          }

          $exeDest = Join-Path $outDir "ZunzShot_${version}_x64-offline-setup.exe"
          $msiDest = Join-Path $outDir "ZunzShot_${version}_x64-offline.msi"
          Copy-Item $exe.FullName $exeDest -Force
          Copy-Item $msi.FullName $msiDest -Force

          gh release upload $tag $exeDest $msiDest --clobber

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "v${VERSION}" --draft=false
