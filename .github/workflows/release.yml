name: Build ZunzShot (macOS & Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-15-intel
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: v__VERSION__
          releaseName: "ZunzShot v__VERSION__"
          releaseBody: |
            Instaladores oficiales de ZunzShot v__VERSION__:
            - **macOS (Universal):** `ZunzShot___VERSION___universal.dmg` (Apple Silicon e Intel)
            - **Windows (Instalador oficial):** `ZunzShot___VERSION___x64-setup.exe`

            ### Novedades incluidas
            - **Animación de inicio ("Desde fuera"):** Al abrir ZunzShot o iniciarse con el sistema, la flor del logo brota sobre el escritorio, el colibrí vuela desde fuera con aleteo fluido hasta picarla y revela la tarjeta con el logotipo **ZunzShot**. No interrumpe capturas ni reaperturas de configuración, y se omite automáticamente en *Modo Ultra Ligero*.
            - **Temas festivos estacionales sin reinstalar:** ZunzShot puede lucir ediciones temporales (Halloween, Navidad, Año Nuevo, San Valentín, etc.) descargando de forma silenciosa una configuración declarativa segura (`splash-festive.json`) con caché local e instantánea.
            - **Control en Configuración:** Desde *General* puedes activar o desactivar la animación de inicio y los temas festivos en cualquier momento.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "v${VERSION}" --draft=false
