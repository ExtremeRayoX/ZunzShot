<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZunzShot</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .toast-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 9px 16px;
        border-radius: 999px;
        background: rgba(11, 16, 28, 0.94);
        border: 1px solid rgba(16, 185, 129, 0.45);
        box-shadow:
          0 10px 26px rgba(0, 0, 0, 0.52),
          0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        color: #f8fafc;
        animation: toastPop 1.75s ease forwards;
      }

      .toast-icon {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .toast-text {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .toast-title {
        font-size: 12.5px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }

      .toast-sub {
        font-size: 10.5px;
        font-weight: 500;
        color: #94a3b8;
        line-height: 1.2;
      }

      @keyframes toastPop {
        0% {
          opacity: 0;
          transform: translateY(-8px) scale(0.96);
        }
        12% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        82% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-6px) scale(0.97);
        }
      }
    </style>
  </head>
  <body>
    <div class="toast-pill">
      <span class="toast-icon" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </span>
      <div class="toast-text">
        <span id="toast-title" class="toast-title"></span>
        <span id="toast-sub" class="toast-sub"></span>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const titleEl = document.getElementById("toast-title");
      const subEl = document.getElementById("toast-sub");
      if (titleEl) {
        titleEl.textContent = params.get("title") || "ZunzShot";
      }
      const sub = params.get("sub");
      if (subEl) {
        if (sub) {
          subEl.textContent = sub;
        } else {
          subEl.style.display = "none";
        }
      }
    </script>
  </body>
</html>
